# SPDX-License-Identifier: Apache-2.0 OR MIT
# CodeQL over the site's first-party JavaScript and the Python build and
# gate scripts. A static site, but one that ships JavaScript to every
# visitor.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            paths: |
                - static/js
          - language: python
            paths: |
                - scripts
          - language: actions
            paths: |
                - .github
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config: |
            paths:
            ${{ matrix.paths }}
            paths-ignore:
              - site

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ matrix.language }}"
