# SPDX-License-Identifier: Apache-2.0 OR MIT
name: CI

# Every push and pull request builds the site from source and runs the
# gates; on main the same run deploys the built tree to GitHub Pages as
# an artifact, so nothing reaches production that did not pass every
# gate, and built output is never committed.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same pin as mise.toml and regenerate.yml; the cache key and the
  # install step both read it.
  SSG_VERSION: 0.0.76

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache ssg binary
        id: cache-ssg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ssg
          key: ssg-${{ env.SSG_VERSION }}-${{ runner.os }}

      - name: Install cargo-binstall
        if: steps.cache-ssg.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Install ssg
        if: steps.cache-ssg.outputs.cache-hit != 'true'
        run: cargo binstall --no-confirm --locked "ssg@${SSG_VERSION}"

      - name: ssg version matches the pin
        run: test "$(ssg --version)" = "ssg ${SSG_VERSION}"

      - name: Build site
        run: ./build.sh

      - name: Audit gates (fail on warnings)
        run: ssg audit -f ssg.toml -o site --severity warn --fail-on warn

      - name: Link integrity (internal links and anchors)
        run: python3 scripts/check_links.py site

      - name: Upload the built site as the Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

  repository-quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow lint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build-and-audit
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
