# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Regenerate for a crypto-service release

# Moves the site to a released suite version: writes VERSION, rebuilds,
# runs the same gates as CI, and exports a source patch for review.
# Apply the patch on the feat/v<version> branch, then SSH-sign and
# DCO-sign the commit; the news entry for the release is written by
# hand from the code repository's CHANGELOG. The workflow has no
# repository write or pull-request permission.
#
# Triggers:
# - repository_dispatch (`crypto-service-release`): sent by the
#   crypto-service release workflow with {"version": "0.0.N"}.
# - workflow_dispatch: by hand, for any version.

on:
  repository_dispatch:
    types: [crypto-service-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Released suite version, e.g. 0.0.41"
        required: true

permissions:
  contents: read

env:
  SSG_VERSION: 0.0.76

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUESTED: ${{ github.event.inputs.version || github.event.client_payload.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the requested version
        run: |
          if ! printf '%s' "$REQUESTED" | grep -Eq '^0\.0\.[0-9]{1,3}$'; then
            echo "::error::not a 0.0.x version: '$REQUESTED'"
            exit 1
          fi

      - name: Cache ssg binary
        id: cache-ssg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ssg
          key: ssg-${{ env.SSG_VERSION }}-${{ runner.os }}

      - name: Install cargo-binstall
        if: steps.cache-ssg.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Install ssg
        if: steps.cache-ssg.outputs.cache-hit != 'true'
        run: cargo binstall --no-confirm --locked "ssg@${SSG_VERSION}"

      - name: Stamp the version
        run: printf '%s\n' "$REQUESTED" > VERSION

      - name: Build site
        run: ./build.sh

      - name: Gates
        run: |
          ssg audit -f ssg.toml -o site --severity warn --fail-on warn
          python3 scripts/check_links.py site
          python3 scripts/check_versions.py site

      - name: Export review patch
        env:
          REVIEW_PATCH: ${{ runner.temp }}/crypto-service-site-update.patch
        run: |
          git add -A -- . ':!site'
          git diff --cached --binary > "$REVIEW_PATCH"
          (cd "$RUNNER_TEMP" && sha256sum crypto-service-site-update.patch > crypto-service-site-update.patch.sha256)
          echo "Apply the ${REQUESTED} patch on feat/v${REQUESTED} and add its news entry." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crypto-service-site-update-${{ env.REQUESTED }}
          path: |
            ${{ runner.temp }}/crypto-service-site-update.patch
            ${{ runner.temp }}/crypto-service-site-update.patch.sha256
          if-no-files-found: error
          retention-days: 14
