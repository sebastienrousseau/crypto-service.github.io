<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 OR MIT -->
<!-- PRISM shell, as used by pain001.com. `no-js` is removed before first
     paint by /js/prism-theme-init.js. -->
<html lang="{{language}}" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />

    <!-- Strict same-origin policy: every script, style and font is served
         from this origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'none';
               object-src 'none';
               script-src 'self';
               style-src 'self';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self';
               manifest-src 'self';
               form-action 'self' https://github.com"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{permalink}}" />
    <meta property="og:image" content="{{site_url}}images/screenshot.png" />
    <meta property="og:image:width" content="1500" />
    <meta property="og:image:height" content="1000" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{site_url}}images/screenshot.png" />

    <link rel="canonical" href="{{permalink}}" />
    <link rel="alternate" type="application/rss+xml" title="Crypto Service RSS" href="/rss.xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/favicon.svg" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://crypto-service.co/#organization",
          "name": "Crypto Service",
          "url": "https://crypto-service.co/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://crypto-service.co/assets/logo.svg"
          },
          "sameAs": [
            "https://github.com/sebastienrousseau/crypto-service"
          ],
          "founder": {
            "@type": "Person",
            "name": "Sebastien Rousseau",
            "url": "https://sebastienrousseau.com/"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://crypto-service.co/#software",
          "name": "Crypto Service Suite",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "Node.js 22 or later (Linux, macOS, Windows); edge runtimes and browsers through crypto-edge",
          "offers": {
            "@type": "Offer",
            "name": "Open source (Apache-2.0 OR MIT)",
            "price": "0",
            "priceCurrency": "USD"
          },
          "description": "Open-source TypeScript cryptography toolkit in 18 npm packages that move in lockstep: FIPS 203 ML-KEM, FIPS 204 ML-DSA and FIPS 205 SLH-DSA algorithms (not a validated module), a self-hosted REST service, a KMS provider interface, database field encryption and CycloneDX CBOM generation, plus thin client SDKs for six other languages.",
          "softwareVersion": "{{version}}",
          "codeRepository": "https://github.com/sebastienrousseau/crypto-service",
          "license": [
            "https://spdx.org/licenses/Apache-2.0.html",
            "https://spdx.org/licenses/MIT.html"
          ],
          "featureList": [
            "FIPS 203 ML-KEM-512/768/1024 key encapsulation (not a validated module)",
            "FIPS 204 ML-DSA-44/65/87 and FIPS 205 SLH-DSA signatures (not a validated module)",
            "Hybrid X25519 + ML-KEM key encapsulation through one v2 combiner",
            "Composite ML-DSA hybrid signatures (draft-ietf-lamps-pq-composite-sigs)",
            "X-Wing as the post-quantum HPKE KEM",
            "Field encryption for Prisma and TypeORM",
            "KMS provider interface: AWS KMS (including ML-DSA signing keys), Google Cloud KMS, HashiCorp Vault Transit and local providers; Azure Key Vault is a stub and PKCS#11 a software simulation",
            "CycloneDX 1.6 and SPDX 3.0 CBOM generation",
            "100% statement, branch, function and line coverage enforced in all 18 packages"
          ],
          "author": {
            "@type": "Person",
            "name": "Sebastien Rousseau",
            "url": "https://sebastienrousseau.com/"
          },
          "publisher": {
            "@id": "https://crypto-service.co/#organization"
          }
        },
        {
          "@type": "WebPage",
          "@id": "{{permalink}}#webpage",
          "url": "{{permalink}}",
          "name": "{{title}}",
          "description": "{{description}}",
          "inLanguage": "{{language}}",
          "isPartOf": { "@id": "https://crypto-service.co/#organization" }
        }
      ]
    }
    </script>

    <!-- PRISM, followed only by Crypto Service extensions. The interface
         face is preloaded because it paints the first text. -->
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/prism.css" />
    <link rel="stylesheet" href="/css/crypto-service-prism.css" />
    <script src="/js/prism-theme-init.js"></script>
  </head>

  <body class="prism-theme">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    {{> header}}

    <main id="main-content">
      {{#block "main"}}{{/block}}
    </main>

    {{> footer}}

    <script src="/js/prism.js" defer></script>
    <script src="/js/crypto-service-prism.js" defer></script>
  </body>
</html>
